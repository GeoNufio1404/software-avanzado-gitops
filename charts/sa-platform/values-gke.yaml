# Ambiente GKE (P9, ampliado en P10). Se aplica encima de values.yaml.
# El pipeline de CI solo modifica las lineas "tag:" de este archivo mediante
# un Pull Request (nunca despliega directamente).

global:
  namespace: sa-p9
  # Vacio: los servicios usan el repository completo de Artifact Registry y
  # MySQL/RabbitMQ se descargan de docker.io.
  imageRegistry: ""
  logLevel: info

mysql:
  primary:
    persistence:
      enabled: true
      storageClass: standard

rabbitmq:
  persistence:
    enabled: true
    storageClass: standard

# 2 replicas por servicio + anti-afinidad + PDB (minAvailable 1):
# el servicio sigue respondiendo mientras se drena un nodo.
auth-service:
  replicaCount: 2
  autoscaling:
    minReplicas: 2
  image:
    repository: us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p9/auth-service
    tag: "1.1.2"

materiales-service:
  replicaCount: 2
  autoscaling:
    minReplicas: 2
  image:
    repository: us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p9/materiales-service
    tag: "1.1.2"

figuras-service:
  replicaCount: 2
  preStopSleepSeconds: 10
  autoscaling:
    minReplicas: 2
  image:
    repository: us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p9/figuras-service
    tag: "1.1.2"
  # P10: instrumentado con OpenTelemetry.
  telemetria:
    enabled: true

ordenes-service:
  replicaCount: 2
  preStopSleepSeconds: 10
  autoscaling:
    minReplicas: 2
  image:
    repository: us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p9/ordenes-service
    tag: "1.1.2"
  # P10: instrumentado con OpenTelemetry.
  telemetria:
    enabled: true

api-gateway:
  replicaCount: 2
  preStopSleepSeconds: 10
  autoscaling:
    minReplicas: 2
  image:
    repository: us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p9/api-gateway
    tag: "1.1.2"
  # P10: instrumentado con OpenTelemetry.
  telemetria:
    enabled: true
  rollout:
    enabled: true
  # P10, prueba del canary: fallo inducido en la version candidata (30 % de
  # las peticiones a /api/ordenes responden 500). Helm reemplaza la lista
  # completa, por eso se repiten las variables por defecto del subchart.
  extraEnv:
    - name: LOG_LEVEL
      value: "info"
    - name: UPSTREAM_TIMEOUT_MS
      value: "5000"
    - name: TZ
      value: "America/Guatemala"
    - name: FALLO_ORDENES_TASA
      value: "0.3"
  ingress:
    enabled: true
    className: gce
    host: ""

cronjobs:
  heartbeatImage: "us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p9/cronjob-heartbeat:1.1.2"
  resumenImage: "us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p9/cronjob-resumen:1.1.2"

# P10: metricas de los servicios hacia Prometheus y trafico de usuarios simulado.
telemetria:
  podMonitor: true

generadorTrafico:
  enabled: true
