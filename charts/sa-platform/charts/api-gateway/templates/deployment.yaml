{{- if .Values.enabled }}
{{- $fullname := include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}
{{- if .Values.rollout.enabled }}
# Entrega progresiva: Argo Rollouts reemplaza al Deployment.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.labels" (dict "root" $ "name" .Chart.Name) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.rollout.enabled }}
  strategy:
    canary:
      # Sin trafficRouting: el porcentaje se aproxima con el numero de pods.
      # P10: sin stableService/canaryService, el Service principal (y el
      # Ingress) reparte el trafico real entre pods estables y canary; el
      # analisis mide en Prometheus solo los pods del canary (por su hash).
      steps:
        {{- range .Values.rollout.canaryWeights }}
        - setWeight: {{ . }}
        - analysis:
            templates:
              - templateName: {{ $fullname }}-metricas
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- end }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sa.serviceAccountName" (dict "root" $ "name" .Chart.Name) }}
      securityContext:
        {{- include "sa.securityContext" (dict "root" $) | nindent 8 }}
      # Reparte las replicas en nodos distintos: al drenar un nodo sigue
      # quedando al menos una replica atendiendo en otro.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 20 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
            {{- if .Values.telemetria.enabled }}
            # Metricas OpenTelemetry (exportador Prometheus); las lee el PodMonitor.
            - name: metrics
              containerPort: {{ .Values.telemetria.metricsPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-config
            {{- if .Values.needsDbSecret }}
            - secretRef:
                name: {{ $.Release.Name }}-db-credentials
            {{- end }}
            {{- if .Values.needsAppSecret }}
            - secretRef:
                name: {{ $.Release.Name }}-app-secrets
            {{- end }}
            {{- if .Values.needsBrokerSecret }}
            - secretRef:
                name: {{ $.Release.Name }}-broker-credentials
            {{- end }}
          {{- if or .Values.extraEnv .Values.telemetria.enabled }}
          env:
            {{- with .Values.extraEnv }}
            {{- include "sa.extraEnv" (dict "root" $ "list" .) | nindent 12 }}
            {{- end }}
            {{- if .Values.telemetria.enabled }}
            {{- include "sa.telemetriaEnv" (dict "root" $ "name" .Chart.Name "values" .Values) | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.preStopSleepSeconds }}
          # Al apagarse, el pod sigue atendiendo unos segundos mientras el
          # Service deja de enviarle trafico; sin esto, las peticiones que
          # llegan en ese intervalo fallan (5xx) en cada despliegue.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ . }}"]
          {{- end }}
          securityContext:
            {{- include "sa.containerSecurityContext" (dict "root" $) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness.path }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness.path }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.startup.path }}, port: {{ .Values.service.port }} }
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
{{- end }}
