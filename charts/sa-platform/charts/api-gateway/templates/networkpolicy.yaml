{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-netpol
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
    {{- if .Values.telemetria.enabled }}
    # P10: Prometheus (namespace observability) lee las metricas.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: {{ .Values.telemetria.metricsPort }}
    {{- end }}
  egress:
    {{- if .Values.telemetria.enabled }}
    # P10: trazas y registros por OTLP al collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4318
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              sa-platform/component: auth-service
        - podSelector:
            matchLabels:
              sa-platform/component: materiales-service
        - podSelector:
            matchLabels:
              sa-platform/component: figuras-service
        - podSelector:
            matchLabels:
              sa-platform/component: ordenes-service
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}