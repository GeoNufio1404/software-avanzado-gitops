{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-netpol
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              sa-platform/component: auth-service
        - podSelector:
            matchLabels:
              sa-platform/component: materiales-service
        - podSelector:
            matchLabels:
              sa-platform/component: figuras-service
        - podSelector:
            matchLabels:
              sa-platform/component: ordenes-service
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}