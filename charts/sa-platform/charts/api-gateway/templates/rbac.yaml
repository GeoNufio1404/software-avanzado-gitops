{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-rb
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa.serviceAccountName" (dict "root" $ "name" .Chart.Name) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
