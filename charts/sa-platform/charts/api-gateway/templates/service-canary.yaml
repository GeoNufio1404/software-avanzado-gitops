{{- if and .Values.enabled .Values.rollout.enabled }}
# Service del canary: Argo Rollouts le agrega el selector del pod-template-hash
# de la version nueva. El analisis prueba la version candidata por aqui.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.labels" (dict "root" $ "name" .Chart.Name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 4 }}
{{- end }}
