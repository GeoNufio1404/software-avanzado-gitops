{{- if and .Values.enabled .Values.rollout.enabled }}
{{- $fullname := include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}
{{- $a := .Values.rollout.analysis }}
{{- /* Peticiones atendidas por los pods canary (por su pod-template-hash). */}}
{{- $canary := printf "namespace=\"%s\", app_kubernetes_io_name=\"%s\", rollouts_pod_template_hash=\"{{args.canary-hash}}\"" .Release.Namespace .Chart.Name }}
# P10: canary gobernado por metricas reales. En cada paso del Rollout se
# consulta Prometheus sobre el trafico que atendieron SOLO los pods de la
# version candidata (etiqueta rollouts_pod_template_hash). Si una metrica
# falla mas de failureLimit veces, el AnalysisRun falla y Argo Rollouts
# aborta y vuelve a la version estable sin intervencion.
#
# Sin datos (len(result) == 0 o NaN) cuenta como fallo: si no se puede
# medir la version candidata, no se promueve.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $fullname }}-metricas
  namespace: {{ .Release.Namespace }}
spec:
  args:
    - name: canary-hash
  metrics:
    - name: tasa-de-error
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      successCondition: len(result) == 1 && !isNaN(result[0]) && result[0] < {{ $a.maxErrorRate }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: |
            (
              sum(rate(printhub_http_request_duration_seconds_count{ {{- $canary }}, http_response_status_code=~"5.."}[{{ $a.window }}]))
              or vector(0)
            )
            /
            sum(rate(printhub_http_request_duration_seconds_count{ {{- $canary }}}[{{ $a.window }}]))
    - name: latencia-p95
      initialDelay: {{ $a.initialDelay }}
      interval: {{ $a.interval }}
      count: {{ $a.count }}
      failureLimit: {{ $a.failureLimit }}
      successCondition: len(result) == 1 && !isNaN(result[0]) && result[0] < {{ $a.maxP95Seconds }}
      provider:
        prometheus:
          address: {{ $a.prometheusAddress }}
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(printhub_http_request_duration_seconds_bucket{ {{- $canary }}}[{{ $a.window }}]))
            )
{{- end }}
