{{- if and .Values.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}
                port:
                  number: {{ .Values.service.port }}
  {{- else }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}
                port:
                  number: {{ .Values.service.port }}
  {{- end }}
{{- end }}