enabled: true
replicaCount: 1
image:
  repository: sa-platform/api-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 8000
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }
autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  minAvailable: 1
probes:
  liveness: { path: /health, initialDelaySeconds: 15, periodSeconds: 10 }
  readiness: { path: /health, initialDelaySeconds: 5, periodSeconds: 5 }
  startup: { path: /health, failureThreshold: 30, periodSeconds: 2 }
rollout:
  enabled: false
  # Tres pasos de promocion; despues de cada uno corre el AnalysisTemplate.
  canaryWeights: [20, 50, 80]
  # P10: el analisis consulta Prometheus (trafico real del canary), no un Job.
  analysis:
    prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc:9090
    # Ventana de las consultas. Con 2 m hay suficientes peticiones al canary
    # aun cuando recibe solo una parte del trafico.
    window: 2m
    # Promueve si, medido SOLO en los pods canary:
    #   tasa de error 5xx < 1 %  (mismo margen del SLO de pedidos: 99 %)
    #   p95 de latencia < 0.5 s  (umbral del SLO de latencia)
    maxErrorRate: "0.01"
    maxP95Seconds: "0.5"
    initialDelay: 1m
    interval: 1m
    count: 3
    # Una medicion mala aislada se tolera; dos abortan y revierten.
    failureLimit: 1
needsDbSecret: false
needsAppSecret: true
needsBrokerSecret: false
ingress:
  enabled: true
  className: nginx
  host: sa-p5.local
# P10: OpenTelemetry (trazas/registros por OTLP, metricas en :metricsPort).
# Apagado por defecto; se activa en values-gke.yaml junto con el stack.
telemetria:
  enabled: false
  otlpEndpoint: http://otel-collector.observability.svc:4318
  metricsPort: 9464
env: {}
extraEnv:
  - name: LOG_LEVEL
    value: "info"
  - name: UPSTREAM_TIMEOUT_MS
    value: "5000"
  - name: TZ
    value: "America/Guatemala"
