enabled: true
replicaCount: 1
image:
  repository: sa-platform/api-gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 8000
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }
autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  minAvailable: 1
probes:
  liveness: { path: /health, initialDelaySeconds: 15, periodSeconds: 10 }
  readiness: { path: /health, initialDelaySeconds: 5, periodSeconds: 5 }
  startup: { path: /health, failureThreshold: 30, periodSeconds: 2 }
rollout:
  enabled: false
  # Tres pasos de promocion; despues de cada uno corre el AnalysisTemplate.
  canaryWeights: [20, 50, 80]
  analysis:
    image: grafana/k6:2.3.0
    # Umbrales de promocion (justificados en P9/docs).
    # Hasta 1 % de peticiones/comprobaciones fallidas: tolera un fallo aislado
    # (p. ej. un /health interno que excede su timeout de 2 s bajo carga) pero
    # detecta una version defectuosa, que falla de forma sistematica.
    maxFailedRate: "0.01"
    minChecksRate: "0.99"
    p95Ms: 500
    vus: 5
    duration: 30s
needsDbSecret: false
needsAppSecret: true
needsBrokerSecret: false
ingress:
  enabled: true
  className: nginx
  host: sa-p5.local
env: {}
extraEnv:
  - name: LOG_LEVEL
    value: "info"
  - name: UPSTREAM_TIMEOUT_MS
    value: "5000"
  - name: TZ
    value: "America/Guatemala"
