{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.labels" (dict "root" $ "name" .Chart.Name) | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sa.serviceAccountName" (dict "root" $ "name" .Chart.Name) }}
      securityContext:
        {{- include "sa.securityContext" (dict "root" $) | nindent 8 }}
      # Reparte las replicas en nodos distintos: al drenar un nodo sigue
      # quedando al menos una replica atendiendo en otro.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 20 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}-config
            {{- if .Values.needsDbSecret }}
            - secretRef:
                name: {{ $.Release.Name }}-db-credentials
            {{- end }}
            {{- if .Values.needsAppSecret }}
            - secretRef:
                name: {{ $.Release.Name }}-app-secrets
            {{- end }}
            {{- if .Values.needsBrokerSecret }}
            - secretRef:
                name: {{ $.Release.Name }}-broker-credentials
            {{- end }}
          {{- if .Values.extraEnv }}
          env:
            {{- include "sa.extraEnv" (dict "root" $ "list" .Values.extraEnv) | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "sa.containerSecurityContext" (dict "root" $) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness.path }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness.path }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          startupProbe:
            httpGet: { path: {{ .Values.probes.startup.path }}, port: {{ .Values.service.port }} }
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
{{- end }}
