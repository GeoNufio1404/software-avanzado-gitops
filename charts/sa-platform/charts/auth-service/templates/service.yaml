{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sa.fullname" (dict "root" $ "name" .Chart.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.labels" (dict "root" $ "name" .Chart.Name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "sa.selectorLabels" (dict "root" $ "name" .Chart.Name) | nindent 4 }}
{{- end }}
