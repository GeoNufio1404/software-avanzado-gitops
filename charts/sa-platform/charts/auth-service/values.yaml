enabled: true
replicaCount: 1
image:
  repository: sa-platform/auth-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 8004
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }
autoscaling:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  minAvailable: 1
probes:
  liveness: { path: /health, initialDelaySeconds: 15, periodSeconds: 10 }
  readiness: { path: /health, initialDelaySeconds: 5, periodSeconds: 5 }
  startup: { path: /health, failureThreshold: 30, periodSeconds: 2 }
networkPolicy:
  allowFrom: ["api-gateway"]
  egressTo: []
  egressMysql: true
  egressRabbitmq: true
needsDbSecret: true
needsAppSecret: true
needsBrokerSecret: true
env: {}
extraEnv:
  - name: LOG_LEVEL
    value: "info"
  - name: JWT_EXPIRATION
    value: "2h"
  - name: TZ
    value: "America/Guatemala"
