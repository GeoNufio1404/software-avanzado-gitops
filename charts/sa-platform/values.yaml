global:
  namespace: sa-p9
  imageRegistry: ""
  logLevel: info

# Namespace, ResourceQuota y LimitRange los crea Terraform (P9/terraform/30-platform).

# Secretos: External Secrets Operator lee GCP Secret Manager (ver templates/external-secrets.yaml).
externalSecrets:
  storeName: gcp-secret-manager
  refreshInterval: 1h
  keys:
    mysqlRootPassword: sa-p9-mysql-root-password
    mysqlPassword: sa-p9-mysql-password
    rabbitmqPassword: sa-p9-rabbitmq-password
    rabbitmqErlangCookie: sa-p9-rabbitmq-erlang-cookie
    jwtSecret: sa-p9-jwt-secret
    aesKey: sa-p9-aes-key

cronjobs:
  heartbeatImage: "sa-platform/cronjob-heartbeat:1.0.0"
  resumenImage: "sa-platform/cronjob-resumen:1.0.0"
  dbHost: "sa-platform-mysql"
  dbName: "auth_db"
  rabbitmqHost: "sa-platform-rabbitmq"
  carne: "201901444"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

mysql:
  enabled: true
  auth:
    database: "auth_db"
    existingSecret: sa-platform-mysql-auth
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: "8.0.35-debian-11-r0"
  # Script de inicializacion (solo corre con el volumen vacio). En el chart
  # de Bitnami 9.x la clave es initdbScripts (primary.initdb no existe).
  initdbScripts:
    init.sql: |
      USE auth_db;
      CREATE TABLE IF NOT EXISTS usuarios (
        id INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50) NOT NULL UNIQUE,
        email_cifrado TEXT NOT NULL,
        email_iv VARCHAR(32) NOT NULL,
        email_auth_tag VARCHAR(32) NOT NULL,
        password_hash VARCHAR(60) NOT NULL,
        rol ENUM('cliente', 'admin') NOT NULL DEFAULT 'cliente',
        creado_en DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
      );
  primary:
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 768Mi

rabbitmq:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: "3.12.12-debian-11-r0"
  auth:
    username: sa_platform
    existingPasswordSecret: sa-platform-rabbitmq-auth
    existingErlangSecret: sa-platform-rabbitmq-auth
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 375m, memory: 384Mi }

# --- Subcharts: cada microservicio hereda defaults aqui, sobreescritos por values-dev/prod ---
auth-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/auth-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8004
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8004"
    DB_HOST: "sa-platform-mysql"
    DB_PORT: "3306"
    DB_NAME: "auth_db"
    AUTH_COOKIE_NAME: "token"
    RABBITMQ_HOST: "sa-platform-rabbitmq"

materiales-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/materiales-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8001
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8001"
    DATABASE_URL: "sqlite:////data/materiales.db"

figuras-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/figuras-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8002
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8002"
    DATABASE_PATH: "/data/figuras.db"
    MATERIALES_SERVICE_URL: "http://sa-platform-materiales-service:8001/graphql"
    RABBITMQ_HOST: "sa-platform-rabbitmq"

ordenes-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/ordenes-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8003
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8003"
    DATABASE_PATH: "/data/ordenes.db"
    FIGURAS_SERVICE_URL: "http://sa-platform-figuras-service:8002/graphql"
    RABBITMQ_HOST: "sa-platform-rabbitmq"

api-gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/api-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8000"
    AUTH_SERVICE_URL: "http://sa-platform-auth-service:8004"
    MATERIALES_SERVICE_URL: "http://sa-platform-materiales-service:8001"
    FIGURAS_SERVICE_URL: "http://sa-platform-figuras-service:8002"
    ORDENES_SERVICE_URL: "http://sa-platform-ordenes-service:8003"
  ingress:
    enabled: true
    className: nginx
    host: sa-p5.local
