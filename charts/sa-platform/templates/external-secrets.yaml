{{/*
Secretos de la plataforma sincronizados desde GCP Secret Manager por External
Secrets Operator. En este repositorio solo existen las REFERENCIAS a los
secretos; los valores viven fuera del cluster, por lo que sobreviven a su
destruccion (continuidad de secretos, P9).
*/}}
{{- $store := .Values.externalSecrets.storeName -}}
{{- $refresh := .Values.externalSecrets.refreshInterval -}}
{{- $keys := .Values.externalSecrets.keys -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Release.Name }}-db-credentials
    template:
      data:
        DB_USER: root
        DB_PASSWORD: "{{ `{{ .rootPassword }}` }}"
        DB_ROOT_PASSWORD: "{{ `{{ .rootPassword }}` }}"
  data:
    - secretKey: rootPassword
      remoteRef:
        key: {{ $keys.mysqlRootPassword }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-broker-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Release.Name }}-broker-credentials
    template:
      data:
        RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | quote }}
        RABBITMQ_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $keys.rabbitmqPassword }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Release.Name }}-app-secrets
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ $keys.jwtSecret }}
    - secretKey: AES_KEY
      remoteRef:
        key: {{ $keys.aesKey }}
---
# Credenciales que consume el subchart de MySQL (auth.existingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-mysql-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Release.Name }}-mysql-auth
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: {{ $keys.mysqlRootPassword }}
    - secretKey: mysql-password
      remoteRef:
        key: {{ $keys.mysqlPassword }}
    - secretKey: mysql-replication-password
      remoteRef:
        key: {{ $keys.mysqlPassword }}
---
# Credenciales que consume el subchart de RabbitMQ (existingPasswordSecret /
# existingErlangSecret). Fijas para que cada render de ArgoCD sea identico.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-rabbitmq-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Release.Name }}-rabbitmq-auth
  data:
    - secretKey: rabbitmq-password
      remoteRef:
        key: {{ $keys.rabbitmqPassword }}
    - secretKey: rabbitmq-erlang-cookie
      remoteRef:
        key: {{ $keys.rabbitmqErlangCookie }}
