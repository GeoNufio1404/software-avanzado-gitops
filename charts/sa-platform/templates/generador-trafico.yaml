{{- if .Values.generadorTrafico.enabled }}
{{- $g := .Values.generadorTrafico }}
# P10: trafico de usuarios simulado, constante y bajo. Sin trafico no hay
# metricas: ni el canary tendria que medir ni los SLO que calcular.
# NO es el analisis del canary (ese solo consulta Prometheus): este
# generador no evalua nada, solo usa la aplicacion como lo haria un cliente
# (iniciar sesion, consultar el catalogo, crear pedidos) a traves del Service
# del api-gateway, que reparte entre pods estables y canary.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-generador-trafico
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.labels" (dict "root" $ "name" "generador-trafico") | nindent 4 }}
data:
  generador.js: |
    import http from "k6/http";
    import { sleep } from "k6";

    const BASE = __ENV.BASE_URL;
    const JSON_H = { headers: { "Content-Type": "application/json" } };
    const USUARIO = { username: "generador-trafico", email: "generador@printhub.local", password: "Generador-2026" };

    export const options = {
      scenarios: {
        usuarios: {
          executor: "constant-arrival-rate",
          rate: Number(__ENV.RPS),
          timeUnit: "1s",
          duration: "24h",
          preAllocatedVUs: 5,
          maxVUs: 20,
        },
      },
    };

    // Registro unico (409 si ya existe tras un reinicio: se ignora).
    export function setup() {
      for (let i = 0; i < 30; i++) {
        const r = http.post(`${BASE}/api/auth/register`, JSON.stringify(USUARIO), JSON_H);
        if (r.status === 201 || r.status === 409) return;
        sleep(10);
      }
    }

    // El JWT vive en una cookie (2 h): cada VU inicia sesion al empezar y cada 30 min.
    let sesionHasta = 0;

    export default function () {
      if (Date.now() > sesionHasta) {
        const r = http.post(`${BASE}/api/auth/login`,
          JSON.stringify({ username: USUARIO.username, password: USUARIO.password }), JSON_H);
        if (r.status !== 200) return;
        sesionHasta = Date.now() + 30 * 60 * 1000;
      }

      // Catalogo inicial de figuras-service: ids 1-3 en todas las replicas.
      const figuraId = 1 + Math.floor(Math.random() * 3);
      if (Math.random() < 0.5) {
        http.post(`${BASE}/api/ordenes`,
          JSON.stringify({ cliente: "cliente-simulado", figuraId, cantidad: 1 + Math.floor(Math.random() * 3) }),
          JSON_H);
      } else {
        http.post(`${BASE}/api/figuras/graphql`,
          JSON.stringify({ query: "query($id: ID!) { figura(id: $id) { id nombre precio } }", variables: { id: figuraId } }),
          JSON_H);
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-generador-trafico
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sa.labels" (dict "root" $ "name" "generador-trafico") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sa.selectorLabels" (dict "root" $ "name" "generador-trafico") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sa.selectorLabels" (dict "root" $ "name" "generador-trafico") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
      containers:
        - name: k6
          image: {{ $g.image }}
          args: ["run", "--quiet", "--summary-mode=disabled", "/scripts/generador.js"]
          env:
            - name: BASE_URL
              value: http://{{ .Release.Name }}-api-gateway:8000
            - name: RPS
              value: {{ $g.rps | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-generador-trafico
{{- end }}
