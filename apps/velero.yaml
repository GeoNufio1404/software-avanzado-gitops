apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.2.0
    helm:
      valuesObject:
        initContainers:
          - name: velero-plugin-for-gcp
            image: velero/velero-plugin-for-gcp:v1.14.3
            volumeMounts:
              - mountPath: /target
                name: plugins
        # Workload Identity en lugar de llave JSON.
        credentials:
          useSecret: false
        serviceAccount:
          server:
            name: velero-server
            annotations:
              iam.gke.io/gcp-service-account: sa-p9-velero@project-2cbee419-ed7b-469e-89d.iam.gserviceaccount.com
        # Volumenes con File System Backup (Kopia) al bucket; sin snapshots de discos.
        snapshotsEnabled: false
        deployNodeAgent: true
        configuration:
          uploaderType: kopia
          defaultVolumesToFsBackup: true
          backupStorageLocation:
            - name: default
              provider: gcp
              bucket: sa-p9-velero-201901444
              default: true
              config:
                serviceAccount: sa-p9-velero@project-2cbee419-ed7b-469e-89d.iam.gserviceaccount.com
        # Respaldo programado: cada hora, retencion de 72 h, incluye los PVC.
        schedules:
          sa-p9-hourly:
            disabled: false
            schedule: "0 * * * *"
            useOwnerReferencesInBackup: false
            template:
              ttl: 72h0m0s
              includedNamespaces: [sa-p9]
              defaultVolumesToFsBackup: true
              storageLocation: default
        configMaps:
          # Contenedor auxiliar que Velero inyecta al restaurar volumenes: debe
          # cumplir las politicas de Kyverno del namespace (limites y no-root).
          fs-restore-action-config:
            labels:
              velero.io/plugin-config: ""
              velero.io/pod-volume-restore: RestoreItemAction
            data:
              cpuRequest: 100m
              memRequest: 128Mi
              cpuLimit: 200m
              memLimit: 128Mi
              secCtx: |
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
