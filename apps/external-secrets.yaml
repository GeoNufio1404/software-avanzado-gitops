apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
          # Workload Identity: el pod actua como esta cuenta de GCP (solo
          # lectura de Secret Manager). Binding en P9/terraform/20-cluster.
          annotations:
            iam.gke.io/gcp-service-account: sa-p9-external-secrets@project-2cbee419-ed7b-469e-89d.iam.gserviceaccount.com
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
