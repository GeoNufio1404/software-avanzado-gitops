apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      valuesObject:
        # Sin esto el subchart genera "labels: {}" y "annotations: {}" en sus
        # CRDs, el API server los descarta y ArgoCD ve la app OutOfSync.
        kyverno-api:
          labels:
            app.kubernetes.io/part-of: kyverno
          annotations:
            policies.kyverno.io/managed-by: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # Los CRDs de Kyverno exceden el limite de anotaciones de client-side apply.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
