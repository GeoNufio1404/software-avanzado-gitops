apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # El chart genera "labels: {}" en algunos CRDs y el API server lo descarta:
  # sin esto la app queda OutOfSync de forma permanente.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers: [/metadata/labels]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # Los CRDs de Kyverno exceden el limite de anotaciones de client-side apply.
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
